name: streaming-service

# ---------------------------------------------------------------------------
# App-only deployment. Postgres, Redis and RustFS are **external** — the app
# reaches them purely through env vars. One image runs three ways: a one-shot
# migration, the HTTP server, and the worker.
#
# Configure via a dedicated env file (NOT the repo's dev .env) and run:
#
#   cp .env.docker.example .env.docker   # then fill it in
#   docker compose --env-file .env.docker up -d --build
#
# Defaults assume the datastores are reachable at `host.docker.internal`
# (Docker Desktop, or Linux via the host-gateway alias below). Override
# DB_HOST / REDIS_HOST / RUSTFS_ENDPOINT to point anywhere else.
# ---------------------------------------------------------------------------

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: streaming-service:latest
  extra_hosts:
    - 'host.docker.internal:host-gateway' # so `host.docker.internal` resolves on Linux
  environment: &app-env
    TZ: UTC
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3333
    APP_URL: ${APP_URL:-http://localhost:3333}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    APP_KEY: ${APP_KEY:?set APP_KEY (e.g. openssl rand -base64 24)}
    # External Postgres
    DB_HOST: ${DB_HOST:-host.docker.internal}
    DB_PORT: ${DB_PORT:-5432}
    DB_USER: ${DB_USER:?set DB_USER}
    DB_PASSWORD: ${DB_PASSWORD:-}
    DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
    # External Redis
    REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    # External RustFS (S3-compatible)
    RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}
    RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    RUSTFS_BUCKET: ${RUSTFS_BUCKET:-streaming-service}
    # Delegated token verification (ADR-0003)
    AUTH_VERIFY_URL: ${AUTH_VERIFY_URL:?set AUTH_VERIFY_URL to your token-verification endpoint}
    AUTH_VERIFY_METHOD: ${AUTH_VERIFY_METHOD:-GET}
    AUTH_VERIFY_STATUS: ${AUTH_VERIFY_STATUS:-200}

services:
  # One-shot: ensure the bucket exists on the external RustFS, then exit.
  #
  # The S3 client is AWS's own, not MinIO's `mc`: that image is no longer served
  # publicly ("pull access denied for minio/mc", reproduced 21/10/2026), so this
  # stack could not be brought up at all on a machine whose image cache is cold
  # — invisible on the machines that still have it, broken for everyone else
  # (#32). Same move as `server-portal` (its #392 / PR #393), and the policy
  # below is byte-for-byte the one production posts via `scripts/rustfs-setup.mjs`
  # of the `context` repo: two repos opening the same prefixes two different ways
  # is the next outage.
  #
  # The tag is pinned on purpose: `latest` is the very trap being repaired here.
  createbucket:
    image: amazon/aws-cli:2.38.1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-streaming-service}
      # The AWS CLI only reads credentials under its own variable names.
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      # A self-hosted store has no regions; S3 demands one in order to sign.
      AWS_DEFAULT_REGION: ${RUSTFS_REGION:-us-east-1}
    # The image's entrypoint is `aws`: replace it, the time to chain three calls.
    # `set -e` is not decoration — `server` and `worker` wait on this container
    # with `service_completed_successfully`, and a chain of `;` exits 0 even when
    # the policy call failed, booting the app onto a bucket nobody opened.
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -e;
        until aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api list-buckets >/dev/null 2>&1; do
          echo 'waiting for rustfs...'; sleep 2;
        done;
        aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api create-bucket --bucket "$$RUSTFS_BUCKET" 2>/dev/null
        || echo "bucket $$RUSTFS_BUCKET already there";
        aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api put-bucket-policy --bucket "$$RUSTFS_BUCKET"
        --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadSelectedPrefixes\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$RUSTFS_BUCKET/hls/*\",\"arn:aws:s3:::$$RUSTFS_BUCKET/dl/*\",\"arn:aws:s3:::$$RUSTFS_BUCKET/radio/*\"]}]}";
        echo "bucket $$RUSTFS_BUCKET ready (hls/ + dl/ + radio/ public)";

  # One-shot: run migrations against the external Postgres, then exit. Booting
  # the app also opens the Redis connection, so external Redis must be up too.
  migrate:
    <<: *app
    command: ['node', 'ace.js', 'migration:run', '--force']
    restart: 'no'

  server:
    <<: *app
    command: ['node', 'bin/server.js']
    ports:
      - '${PORT:-3333}:3333'
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'ace.js', 'transcode:work']
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped
# Caddy is **not** part of this stack: in production it is an independent,
# externally-operated front door. Point it at the app and RustFS with the
# provided Caddyfile (see the README). The `createbucket` step above still marks
# the bucket's hls/, dl/ and radio/ prefixes publicly readable so that external
# Caddy can serve them.
