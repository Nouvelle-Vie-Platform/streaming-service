name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · test
    runs-on: ubuntu-24.04

    # **Le job tourne dans un conteneur, et c'est ffmpeg qui le commande.** Sur l'hôte
    # `ubuntu-24.04`, `apt` livre ffmpeg **6.1.1** ; l'image de production part de
    # `node:24-trixie-slim`, soit **7.1.5**. Or `RUNBOOK.md` l'a mesuré : ffmpeg 7.0 a
    # introduit l'ordonnanceur multi-fils (un fil par sortie) et il vaut un facteur **×4**
    # sur la passe à six sorties. Le test d'encodage réel d'ADR-0009 s'exécutait donc sur
    # une version quatre fois plus lente que la production — il mesurait autre chose qu'elle.
    # L'image est la base de production en version non allégée : `git` (checkout) et `apt`
    # (ffmpeg) y sont.
    #
    # Effet de bord bienvenu : dans le conteneur, les services se joignent par leur nom et
    # ne publient plus rien. Un `127.0.0.1:5432` du job ne peut plus désigner que lui-même —
    # et jamais le PostgreSQL d'une machine hôte.
    container: node:24-trixie

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
          POSTGRES_DB: streaming_service_test
        options: >-
          --health-cmd "pg_isready -U streaming"
          --health-interval 5s --health-timeout 5s --health-retries 12

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      TZ: UTC
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3333
      APP_URL: http://localhost:3333
      LOG_LEVEL: info
      APP_KEY: ci_app_key_0000000000000000000000
      # Service `postgres` du job, joint par son nom
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: streaming
      DB_PASSWORD: streaming
      DB_DATABASE: streaming_service_test
      # Service `redis` du job, joint par son nom
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RustFS + auth are not reached by the test suite — dummy but valid values.
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci
      RUSTFS_BUCKET: streaming-service
      AUTH_VERIFY_URL: http://127.0.0.1:9999/verify
      HLS_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v7

      # ffmpeg est la dépendance centrale de ce service, pas un détail : la suite
      # comporte un test qui fait un VRAI passage d'encodage (ADR-0009). Sans lui,
      # ce test échoue en `spawn ffmpeg ENOENT` et la CI est rouge en permanence —
      # ce qu'elle était depuis le 21 août. Une CI durablement rouge ne signale
      # plus rien : on cesse de la lire, et la vraie régression passe avec.
      - name: Install ffmpeg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ace valide les métadonnées de chaque commande de `commands/` au démarrage.
      # Une incompatibilité dans cette validation rend TOUTES les commandes
      # personnalisées inutilisables — le worker de transcodage compris — sans que
      # rien d'autre ne le signale : le serveur HTTP, lui, démarre parfaitement.
      # C'est arrivé le 08/09/2026 (jsonschema 1.5.0, « Invalid URL »), découvert
      # seulement quand le worker s'est mis à redémarrer en boucle en production.
      - name: Les commandes ace se chargent
        run: node ace list > /dev/null

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate (sets up the DB, regenerates schema)
        run: node ace migration:run

      - name: Test
        run: node ace test
