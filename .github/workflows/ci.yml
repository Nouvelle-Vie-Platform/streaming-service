name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
          POSTGRES_DB: streaming_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U streaming"
          --health-interval 5s --health-timeout 5s --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      TZ: UTC
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3333
      APP_URL: http://localhost:3333
      LOG_LEVEL: info
      APP_KEY: ci_app_key_0000000000000000000000
      # Postgres service
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: streaming
      DB_PASSWORD: streaming
      DB_DATABASE: streaming_service_test
      # Redis service
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # RustFS + auth are not reached by the test suite — dummy but valid values.
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_ACCESS_KEY: ci
      RUSTFS_SECRET_KEY: ci
      RUSTFS_BUCKET: streaming-service
      AUTH_VERIFY_URL: http://127.0.0.1:9999/verify
      HLS_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      # ffmpeg est la dépendance centrale de ce service, pas un détail : la suite
      # comporte un test qui fait un VRAI passage d'encodage (ADR-0009). Sans lui,
      # ce test échoue en `spawn ffmpeg ENOENT` et la CI est rouge en permanence —
      # ce qu'elle était depuis le 21 août. Une CI durablement rouge ne signale
      # plus rien : on cesse de la lire, et la vraie régression passe avec.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate (sets up the DB, regenerates schema)
        run: node ace migration:run

      - name: Test
        run: node ace test
