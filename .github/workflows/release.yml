name: release

# Build + push de l'image sur GHCR, puis déploiement blue/green sur le VPS.
# Déclenché UNIQUEMENT par un tag semver : `git tag v1.0.1 && git push origin v1.0.1`.
# (Le `ci.yml` existant reste le garde-fou lint/typecheck/test sur main + PR.)
on:
  push:
    tags: ['v*']

concurrency:
  group: release-stream
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags = le tag git tel quel + latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nouvelle-vie-platform/streaming-service
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sans cela, buildx joint à l'image des manifestes d'attestation
          # (provenance, SBOM) et publie un index multi-manifestes. Le Docker du
          # VPS échoue à les récupérer : « failed commit on ref
          # attestation-sha256:… : lease does not exist ». Le déploiement s'arrête
          # alors au `docker pull`, avant toute modification — mais il s'arrête.
          # Ces attestations n'ont aucun usage dans ce déploiement.
          provenance: false
          sbom: false

      - name: Deploy (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # **Le budget de l'action doit dépasser le pire cas du script.**
          #
          # `appleboy/ssh-action` coupe la commande au bout de **10 minutes** par
          # défaut, et `deploy.sh` peut légitimement durer plus : 120 s de drain
          # du serveur sortant, puis jusqu'à **600 s** pour l'ancien worker —
          # `worker.close()` attend la fin du transcodage en cours, et le
          # `stop_grace_period` du service vaut exactement ces dix minutes.
          #
          # Le déploiement était donc **structurellement condamné à rougir** dès
          # qu'un sermon se transcodait pendant la bascule : le trafic était déjà
          # sur la nouvelle couleur, le service tournait, et le job échouait
          # quand même. Mesuré sur `v1.1.2` — arrêt du worker à 20:19:36, coupure
          # SSH à 20:26:36, alors que tout le reste avait réussi.
          #
          # 20 min laisse le pire cas passer avec de la marge, sans transformer
          # un vrai blocage en attente d'une heure.
          command_timeout: 20m
      # Le garde-barrière SSH côté VPS (`ssh_commande.sh`, commande forcée dans
      # authorized_keys) n'accepte QUE cette forme : le chemin exact du script suivi
      # d'une référence d'image de CE dépôt. On passe donc l'image complète, pas le
      # seul tag — une clé volée ne peut ainsi déployer aucune autre image.
          script: /opt/eenv-stream/deploy.sh ghcr.io/nouvelle-vie-platform/streaming-service:${{ github.ref_name }}
